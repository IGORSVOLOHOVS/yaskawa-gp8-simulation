name: release-gate
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [release]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Only test branch may enter release
        run: |
          if [[ "${{ github.head_ref }}" != "test" ]]; then
            echo "::error::release accepts changes only from test branch"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev python3

      - name: Verify Environment
        run: ./robot init

      - name: Build Release Binary
        run: ./robot build release

      - name: Run Unit Tests
        run: ./robot test

      - name: Prove Silent Installation
        run: ./robot install

      - name: Verify Binary Info Status
        run: ./robot info

      - name: Prove Silent Uninstallation
        run: ./robot uninstall
